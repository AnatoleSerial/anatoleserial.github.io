<!doctype html>
<html lang="en">
		<head>
				<meta charset="utf-8">
				<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>AnatoleSerial.com</title>
				<meta name="description" content="Regrettable, A Blog.">
				<link rel="alternate" href="feed/feed.xml" type="application/atom+xml" title="AnatoleSerial.com">
				<link rel="stylesheet" href="https://unpkg.com/98.css">
				
				
				<style>
						body {
	margin: 0;
	padding: 0;
	background: #c0c0c0;
}

main {
	width: 65rem;
	margin-left: 240px;
	margin-bottom: 60px;
}

aside {
	width: 200px;
	position: fixed;
	top: 0;
	bottom: 0;
	padding: 8px;
	display: flex;
	align-items: stretch;
}

aside .tree-view {
	width: 100%;
	/* TODO: Move scrollbar into the recessed region? */
	overflow-y: scroll;
}

h1 {
	margin: 12px 0;
}

hr {
	margin: 0;
	border: none;
	width: 400px;
	height: 1px;
	opacity: 0.5;
	background: linear-gradient(to right,
			red 20%,
			yellow 20%,
			yellow 36%,
			green 36%,
			green 60%,
			blue 60%,
			blue 100%);
}

h2 {
	margin-bottom: 12px;
}

h3,
h4 {
	/* Swap the margin for a top-padding so linking to this section
     results in a better scroll position */
	padding-top: 20px;
	margin-top: 0;
	display: block;
	flex: 0 0 180px;
}

p {
	max-width: 50rem;
	line-height: 1.5;
}

.component {
	display: flex;
	margin-top: 24px;
}

blockquote {
	margin: 0 0 20px;
	padding: 20px;
	background: #dfdfdf;
}

blockquote footer {
	margin: 12px 0 0 12px;
}

.example {
	margin: 16px 0;
	padding: 12px 24px;
	border-left: 1px solid #808080;
}

details {
	margin-top: 12px;
}

summary {
	user-select: none;
	cursor: pointer;
	display: inline;
}

details[open] summary {
	margin-bottom: 8px;
}

button.focused {
	outline: 1px dotted #000000;
	outline-offset: -4px;
}

button.active {
	box-shadow: inset -1px -1px #ffffff, inset 1px 1px #0a0a0a,
		inset -2px -2px #dfdfdf, inset 2px 2px #808080;
}

@media (max-width: 480px) {
	aside {
		display: none;
	}

	main {
		box-sizing: border-box;
		width: 100%;
		margin: 0;
		padding: 16px;
	}

	hr {
		width: 100%;
	}

	p {
		width: 100%;
	}

	h3,
	h4 {
		flex: 0;
	}

	.component {
		display: block;
		margin-top: 24px;
	}

	pre {
		overflow-x: scroll;
	}
}

h1 {
	font-size: 2.0rem;
	font-weight: bold;
}

h2 {
	font-size: 1.8rem;
	font-weight: bold;
}

h3 {
	font-size: 1.6rem;
	font-weight: bold;
}

h4 {
	font-size: 1.2rem;
	font-weight: bold;
}
				</style>
		</head>
		<body>
				<aside>
						<ul class="tree-view">
										<li>
												<a href="/eleventy-base-blog/">Home</a>
										</li>
										<li>
												<a href="/eleventy-base-blog/blog/">Archive</a>
										</li>
										<li>
												<a href="/eleventy-base-blog/about/">About</a>
										</li>
										<li>
												<a href="/eleventy-base-blog/feed/feed.xml">Feed</a>
										</li>
						</ul>
				</aside>
				<main>
						<div class="window" style="width: 80%">
								<div class="title-bar">
										<div class="title-bar-text">
												AnatoleSerial.com
										</div>
										<div class="title-bar-controls">
												<button aria-label="Minimize"></button>
												<button aria-label="Maximize"></button>
												<button aria-label="Close"></button>
										</div>
								</div>
								<div class="window-body">
										<heading-anchors>
												<h1 id="about">About</h1>
<p>I am a person that writes stuff.</p>


										</heading-anchors>
								</div>
								<div class="status-bar">
										<footer>
												<p class="status-bar-field">
														<em>Built with
																<a href="https://www.11ty.dev/">Eleventy v3.0.0</a>
														</em>
														on
														2025-01-14T08:14:00.379Z
												</p>
										</footer>
								</div>

								<script type="module" src="/eleventy-base-blog/dist/rJ3_G-2ArF.js"></script>
						</div>
				</main>
		</body>
</html>
